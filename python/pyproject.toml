[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pect"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "scipy",
    "matplotlib",
    "pandas",
    "pyserial",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["analysis*", "core*", "experiments*", "models*", "plots*", "ui*"]
